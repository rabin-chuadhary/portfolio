const AppContext = createContext();
function AppProvider({ children }) {
  const [page, setPage] = useState('home');
  const [params, setParams] = useState({});
  const [location, setLocation] = useState(LOCATIONS[0]);
  const [cart, setCart] = useState([]);
  const [favorites, setFavorites] = useState([]);
  const [user, setUser] = useState(null);
  const [notifications, setNotifications] = useState([
    { id:1, title:'Order accepted', body:'Mobile World accepted your order #EP10284', time:'2 min ago', read:false },
    { id:2, title:'New message', body:'Ramesh Auto Service: Bike is ready', time:'1 hr ago', read:false },
    { id:3, title:'Delivery nearby', body:'Your order is 1.2 km away', time:'Yesterday', read:true },
  ]);
  const [searchQuery, setSearchQuery] = useState('');
  const [showLoc, setShowLoc] = useState(false);
  const [showAuth, setShowAuth] = useState(false);

  const navigate = (p, pr={}) => { setPage(p); setParams(pr); window.scrollTo({top:0,behavior:'smooth'}); };
  const addToCart = (prod, qty=1) => {
    setCart(prev => {
      const ex = prev.find(i => i.id === prod.id);
      if (ex) return prev.map(i => i.id === prod.id ? {...i, qty:i.qty+qty} : i);
      return [...prev, {...prod, qty}];
    });
  };
  const updateQty = (id, qty) => {
    if (qty <= 0) setCart(p => p.filter(i => i.id !== id));
    else setCart(p => p.map(i => i.id === id ? {...i, qty} : i));
  };
  const removeFromCart = id => setCart(p => p.filter(i => i.id !== id));
  const toggleFav = id => setFavorites(p => p.includes(id) ? p.filter(f => f !== id) : [...p, id]);
  const cartTotal = cart.reduce((s,i) => s + i.price * i.qty, 0);
  const cartCount = cart.reduce((s,i) => s + i.qty, 0);

  return (
    <AppContext.Provider value={{ page, params, navigate, location, setLocation, cart, addToCart, updateQty, removeFromCart, cartTotal, cartCount, favorites, toggleFav, user, setUser, notifications, setNotifications, searchQuery, setSearchQuery, showLoc, setShowLoc, showAuth, setShowAuth }}>
      {children}
    </AppContext.Provider>
  );
}

function Btn({ children, variant='primary', size='md', className='', onClick, disabled }) {
  const base = 'inline-flex items-center justify-center font-medium transition-all duration-200 rounded-xl focus:outline-none disabled:opacity-50';
  const variants = {
    primary: 'bg-brand-600 text-white hover:bg-brand-700 shadow-sm',
    secondary: 'bg-white text-neutral-900 border border-neutral-200 hover:bg-neutral-50',
    ghost: 'text-neutral-600 hover:bg-neutral-100',
    dark: 'bg-neutral-900 text-white hover:bg-neutral-800',
    outline: 'border border-neutral-300 text-neutral-700 hover:bg-neutral-50',
  };
  const sizes = { sm:'px-3 py-1.5 text-sm gap-1.5', md:'px-4 py-2.5 text-sm gap-2', lg:'px-6 py-3.5 text-base gap-2', xl:'px-8 py-4 text-base gap-2' };
  return <button className={cn(base, variants[variant], sizes[size], className)} onClick={onClick} disabled={disabled}>{children}</button>;
}

function Badge({ children, color='gray' }) {

  return <span className={cn('inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium', c[color])}>{children}</span>;
}

        <div className="space-y-3">
          {ORDERS.map(o => (
            <div key={o.id} onClick={() => navigate('tracking',{id:o.id})} className="bg-white rounded-2xl border border-neutral-100 p-4 cursor-pointer hover:shadow-card transition">
              <div className="flex justify-between mb-1"><span className="font-medium">#{o.id}</span><Badge color={o.status==='delivered'?'green':'blue'}>{o.status==='delivered'?'Delivered':'In progress'}</Badge></div>
              <p className="text-sm text-neutral-500 mb-1">{o.seller}</p>
              <p className="text-sm text-neutral-600">{o.items.map(i=>i.name).join(', ')}</p>
              <div className="flex justify-between mt-2.5 pt-2.5 border-t border-neutral-50"><span className="font-semibold text-sm">{formatPrice(o.total)}</span><span className="text-xs text-neutral-400">{new Date(o.placedAt).toLocaleDateString()}</span></div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ProfilePage() {
  const { user, setUser, setShowAuth, navigate } = useApp();
  if (!user) return (
    <div className="pb-24 min-h-[55vh] flex flex-col items-center justify-center px-4">
      <div className="w-14 h-14 rounded-full bg-neutral-100 flex items-center justify-center mb-3"><Icon name="user" size={26} className="text-neutral-400" /></div>
      <h2 className="font-display font-semibold text-xl mb-1">Sign in to continue</h2>
      <p className="text-neutral-500 mb-5 text-center">Track orders, save favorites and more</p>
      <Btn onClick={() => setShowAuth(true)}>Sign in with phone</Btn>
    </div>
  );
  const menu = [
    {label:'Orders',icon:'package',page:'orders'},{label:'Rentals',icon:'key',page:'rent'},{label:'Saved items',icon:'heart',page:'explore'},
    {label:'Messages',icon:'msg',page:'messages'},{label:'Addresses',icon:'mapPin',page:'profile'},{label:'Settings',icon:'settings',page:'profile'},
    {label:'Seller dashboard',icon:'barChart',page:'seller-dashboard'},{label:'Rider dashboard',icon:'bike',page:'rider-dashboard'},
  ];
  return (
    <div className="pb-24 lg:pb-12">
      <div className="max-w-lg mx-auto px-4 sm:px-6 pt-7">
        <div className="flex items-center gap-3.5 mb-6">
          <div className="w-14 h-14 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center text-xl font-semibold">{user.name[0]}</div>
          <div><h1 className="font-display font-bold text-xl">{user.name}</h1><p className="text-sm text-neutral-500">+977 {user.phone}</p></div>
        </div>
        <div className="bg-white rounded-2xl border border-neutral-100 overflow-hidden mb-5">
          {menu.map((m,i) => (
            <button key={m.label} onClick={() => navigate(m.page)} className={cn('w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-neutral-50 transition', i>0&&'border-t border-neutral-50')}>
              <Icon name={m.icon} size={17} className="text-neutral-400" /><span className="flex-1 font-medium text-sm">{m.label}</span><Icon name="chevronR" size={15} className="text-neutral-300" />
            </button>
          ))}
        </div>
        <Btn variant="outline" className="w-full" onClick={() => setUser(null)}><Icon name="logOut" size={15} /> Sign out</Btn>
      </div>
    </div>
  );
}

function NotificationsPage() {
  const { notifications, setNotifications } = useApp();
  return (
    <div className="pb-24 lg:pb-12">
      <div className="max-w-lg mx-auto px-4 sm:px-6 pt-7">
        <div className="flex items-center justify-between mb-5"><h1 className="font-display font-bold text-2xl">Notifications</h1>
          <button onClick={() => setNotifications(n => n.map(x=>({...x,read:true})))} className="text-sm text-brand-600 font-medium">Mark all read</button></div>
        <div className="space-y-2">{notifications.map(n => (
          <div key={n.id} className={cn('p-3.5 rounded-xl border transition', n.read?'bg-white border-neutral-100':'bg-brand-50 border-brand-100')}>
            <p className="font-medium text-sm">{n.title}</p><p className="text-sm text-neutral-600 mt-0.5">{n.body}</p><p className="text-xs text-neutral-400 mt-1.5">{n.time}</p>
          </div>
        ))}</div>
      </div>
    </div>
  );
}

function MessagesPage() {
  return (
    <div className="pb-24 min-h-[45vh] flex flex-col items-center justify-center px-4">
      <Icon name="msg" size={30} className="text-neutral-300 mb-2" />
      <h2 className="font-display font-semibold text-lg mb-0.5">Messages</h2>

}

        <nav className="flex-1 p-2.5 space-y-0.5">
          {['Dashboard','Orders','Products','Inventory','Customers','Messages','Analytics','Settings'].map((m,i) => (

          ))}
        </div>
        <div className="bg-white rounded-2xl border border-neutral-100 p-5 mb-5">
          <h3 className="font-semibold mb-3">Sales this week</h3>
          <div className="flex items-end gap-1.5 h-28">{[40,65,45,80,55,90,70].map((h,i)=>(
            <div key={i} className="flex-1 flex flex-col items-center gap-1"><div className="w-full bg-brand-500 rounded-t" style={{height:`${h}%`}} /><span className="text-[10px] text-neutral-400">{['M','T','W','T','F','S','S'][i]}</span></div>

            <div key={o.id} className="flex items-center justify-between py-2 border-b border-neutral-50 last:border-0">
              <div><p className="font-medium text-sm">{o.id}</p><p className="text-xs text-neutral-500">{o.item}</p></div>
              <div className="text-right"><p className="font-medium text-sm">{formatPrice(o.amount)}</p><Badge color={o.status==='Delivered'?'green':'blue'}>{o.status}</Badge></div>

function App() {
  const { page } = useApp();
  const pages = { home:HomePage, explore:ExplorePage, search:SearchPage, product:ProductPage, seller:SellerPage, cart:CartPage, checkout:CheckoutPage, tracking:TrackingPage, rent:RentPage, hire:HirePage, find:FindPage, orders:OrdersPage, profile:ProfilePage, notifications:NotificationsPage, messages:MessagesPage, 'seller-dashboard':SellerDashboard, 'rider-dashboard':RiderDashboard };
  const Page = pages[page] || HomePage;
  const isDash = page==='seller-dashboard' || page==='rider-dashboard';
  return (
    <div className="min-h-screen">
      {!isDash && <Navbar />}
      <Page />
      {!isDash && <MobileNav />}
      <LocationModal />
      <AuthModal />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppProvider><App /></AppProvider>);
</script>
</body>
</html>
